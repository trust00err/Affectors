<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Affectors — визуализация</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="hero">
        <img src="../docs/banner.jpg" alt="Affectors" class="banner">
        <p class="tagline">visual playground</p>
    </header>

    <main>
        <section class="panel">
            <h2>обучение</h2>
            <p class="hint">слова через пробел или с новой строки — модель учит биграммы символов</p>
            <textarea id="words-input" rows="6" spellcheck="false">кот код ток крот лодка окно мода</textarea>
            <div class="row">
                <label class="file-btn">-txt
                    <input type="file" id="file-input" accept=".txt">
                </label>
                <button id="train-btn" class="btn">обучить</button>
                <span id="stats" class="stats"></span>
            </div>
            <label class="slider-row">temperature
                <input type="range" id="temperature" min="0.5" max="2.5" step="0.1" value="1">
                <span id="temperature-value">1.0</span>
            </label>
        </section>

        <section class="panel">
            <h2>генерация</h2>
            <div class="row">
                <button id="generate-one-btn" class="btn">слово</button>
                <button id="generate-batch-btn" class="btn">5 слов</button>
                <label class="slider-row">длина
                    <input type="range" id="max-len" min="4" max="16" step="1" value="12">
                    <span id="max-len-value">12</span>
                </label>
            </div>
            <div id="output" class="output"></div>
        </section>

        <section class="panel">
            <h2>матрица биграмм</h2>
            <canvas id="heatmap" width="240" height="240"></canvas>
            <p class="hint">строка — текущий символ, столбец — следующий</p>
        </section>
    </main>

    <footer>
        <p>affectors · simple graph-net library based on numpy &amp; torch</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
